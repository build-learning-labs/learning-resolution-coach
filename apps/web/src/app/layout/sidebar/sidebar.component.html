<div [class.w-64]="!isCollapsed" [class.w-20]="isCollapsed" 
     class="h-screen bg-gray-900 text-white flex flex-col shadow-lg transition-all duration-300 ease-in-out relative">

    <button (click)="toggleSidebar()" 
            class="absolute -right-3 top-9 bg-blue-600 rounded-full p-1 text-white shadow-md hover:bg-blue-500 transition-colors z-50">
        <svg [class.rotate-180]="isCollapsed" class="w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
    </button>

    <div class="p-6 flex items-center gap-3 border-b border-gray-800 overflow-hidden whitespace-nowrap">
        <div class="w-8 h-8 min-w-[2rem] bg-blue-600 rounded-lg flex items-center justify-center font-bold">L</div>
        <span *ngIf="!isCollapsed" class="text-xl font-bold tracking-tight transition-opacity duration-200">LRC V2</span>
    </div>

    <nav class="flex-1 p-4 space-y-2 overflow-x-hidden">

        <a routerLink="/dashboard" routerLinkActive="bg-blue-600/20 text-blue-400 border-r-2 border-blue-400"
           class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition-all group overflow-hidden whitespace-nowrap"
           title="Dashboard">
            <svg class="w-5 h-5 min-w-[1.25rem]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
            </svg>
            <span *ngIf="!isCollapsed" class="transition-opacity duration-200">Dashboard</span>
        </a>

        <a routerLink="/plan" routerLinkActive="bg-blue-600/20 text-blue-400 border-r-2 border-blue-400"
           class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition-all group overflow-hidden whitespace-nowrap"
           title="My Learning Plan">
            <svg class="w-5 h-5 min-w-[1.25rem]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
            </svg>
            <span *ngIf="!isCollapsed" class="transition-opacity duration-200">My Learning Plan</span>
        </a>

        <a routerLink="/resources" routerLinkActive="bg-blue-600/20 text-blue-400 border-r-2 border-blue-400"
           class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition-all group overflow-hidden whitespace-nowrap"
           title="Resources">
            <svg class="w-5 h-5 min-w-[1.25rem]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
            </svg>
            <span *ngIf="!isCollapsed" class="transition-opacity duration-200">Resources</span>
        </a>

        <a routerLink="/profile" routerLinkActive="bg-blue-600/20 text-blue-400 border-r-2 border-blue-400"
           class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition-all group overflow-hidden whitespace-nowrap"
           title="Profile">
            <svg class="w-5 h-5 min-w-[1.25rem]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
            <span *ngIf="!isCollapsed" class="transition-opacity duration-200">Profile</span>
        </a>

    </nav>

    <div class="p-4 border-t border-gray-800 overflow-hidden whitespace-nowrap">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 min-w-[2.5rem] rounded-full bg-gray-700"></div>
            <div *ngIf="!isCollapsed" class="flex flex-col transition-opacity duration-200">
                <span class="text-sm font-medium text-white">User</span>
                <span class="text-xs text-gray-500">Free Plan</span>
            </div>
        </div>
    </div>
</div>
